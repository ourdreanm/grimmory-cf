<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品详情 · Grimmory CF</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f4f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:25px 18px}.top{display:flex;gap:10px;margin-bottom:20px}a{text-decoration:none;color:inherit}button{background:#fff;color:#111827;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.ghost{background:#182238;color:#dbeafe;border:1px solid #34405a}.hero{display:grid;grid-template-columns:220px 1fr;gap:25px;background:#121a2d;border:1px solid #263047;border-radius:18px;padding:20px}.cover{height:300px;background:#1b263e;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:55px}.cover img{width:100%;height:100%;object-fit:cover}.meta h1{margin:0 0 8px}.muted{color:#9ca3af}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #34405a;border-radius:99px;padding:4px 9px;font-size:12px}.desc{line-height:1.8;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.source{background:#10182a;border:1px solid #263047;border-radius:12px;padding:12px;margin:8px 0}.chapters{margin-top:22px}.chapter{padding:13px;border-bottom:1px solid #263047;display:flex;justify-content:space-between;gap:10px}.empty{padding:20px;color:#9ca3af}@media(max-width:650px){.hero{grid-template-columns:1fr}.cover{height:260px}}
</style></head><body><main><div class="top"><a href="/"><button class="ghost">← 返回首页</button></a><a href="/" id="libraryLink"><button class="ghost">📚 书架</button></a></div><div id="app" class="muted">加载中…</div></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function typeName(t){return t==='comic'?'漫画':t==='novel'?'小说':'书籍'}async function main(){const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('缺少作品 ID');const d=await api('/api/works?id='+encodeURIComponent(id)),w=d.work,s=d.sources||[];let chapters=[];try{chapters=(await api('/api/chapters?work_id='+id)).chapters||[]}catch(e){}const canRead=chapters.length>0;$('app').innerHTML='<section class="hero"><div class="cover">'+(w.cover_url?'<img src="'+esc(w.cover_url)+'">':'📚')+'</div><div class="meta"><h1>'+esc(w.title)+'</h1><div class="muted">'+esc(w.author||'未知作者')+'</div><div class="badges"><span class="pill">'+typeName(w.type)+'</span>'+(w.language?'<span class="pill">'+esc(w.language)+'</span>':'')+(w.status?'<span class="pill">'+esc(w.status)+'</span>':'')+(w.year?'<span class="pill">'+esc(w.year)+'</span>':'')+'<span class="pill">'+chapters.length+' 章</span></div><p class="desc">'+esc(w.description||'暂无简介')+'</p><div class="actions">'+(canRead?'<a href="/reader.html?work_id='+w.id+'&chapter_id='+chapters[0].id+'"><button>▶ 开始阅读</button></a>':'')+(d.library?'<button class="ghost" onclick="remove()">已在书架 · 移除</button>':'<button onclick="add()">＋ 加入书架</button>')+'</div><div class="muted">收藏 '+Number(w.favorite_count||0)+' · 数据来源 '+s.length+' 个</div></div></section><section class="chapters"><h2>📖 章节</h2>'+(chapters.length?chapters.map((c,i)=>'<div class="chapter"><span>第 '+(i+1)+' 章 · '+esc(c.title)+'</span><a href="/reader.html?work_id='+w.id+'&chapter_id='+c.id+'"><button class="ghost">阅读</button></a></div>').join(''):'<div class="empty">当前来源只提供作品元数据，没有可直接阅读的章节。你仍然可以把作品加入书架。</div>')+'</section><section><h2>🔗 来源</h2>'+s.map(x=>'<div class="source"><b>'+esc(x.source_name)+'</b><div class="muted">'+(x.reader_available?'支持阅读':'当前未提供站内阅读')+'</div>'+(x.source_url?'<a href="'+esc(x.source_url)+'" target="_blank"><button class="ghost">打开来源</button></a>':'')+'</div>').join('')+'</section>'}async function add(){try{await api('/api/library',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({work_id:Number(new URLSearchParams(location.search).get('id')),status:'want'})});location.reload()}catch(e){alert(e.message)}}async function remove(){if(!confirm('确定从书架移除？'))return;try{await api('/api/library?work_id='+new URLSearchParams(location.search).get('id'),{method:'DELETE'});location.reload()}catch(e){alert(e.message)}}main().catch(e=>$('app').textContent='加载失败：'+e.message);</script></body></html>
