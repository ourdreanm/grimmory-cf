<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的书库 · Grimmory CF</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111720ee;backdrop-filter:blur(12px);border-bottom:1px solid #27313d;padding:14px 18px;display:flex;gap:10px;align-items:center}.brand{font-weight:800;flex:1}a,button{border:1px solid #344252;background:#18212c;color:#e8edf3;border-radius:9px;padding:9px 13px;text-decoration:none;cursor:pointer}.wrap{max-width:1150px;margin:auto;padding:28px 18px 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.active{background:#283646;border-color:#6b7c90}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:#111720;border:1px solid #27313d;border-radius:14px;padding:14px;display:flex;gap:13px}.cover{width:88px;height:126px;object-fit:cover;border-radius:7px;background:#18212c;flex:none}.meta{color:#8e9baa;font-size:12px}.progress{height:7px;background:#252f3b;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#8fa3b8}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.empty{text-align:center;padding:45px;color:#8e9baa;border:1px dashed #33404e;border-radius:12px}.err{color:#ff9b9b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">📚 我的书库</div><a href="/">🔎 搜索</a></header><main class="wrap"><h1>我的书库</h1><div class="tabs"><button class="active" data-status="">全部</button><button data-status="want">想看</button><button data-status="reading">正在阅读</button><button data-status="completed">已完成</button><button data-favorite="1">⭐ 收藏</button></div><div id="app" class="empty">加载中……</div></main><script>const app=document.querySelector('#app');let status='',favorite='';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){app.innerHTML='<div class="empty">正在加载……</div>';const p=new URLSearchParams();if(status)p.set('status',status);if(favorite)p.set('favorite',favorite);try{const r=await fetch('/api/library?'+p,{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(r.status===401){app.innerHTML='<div class="empty">请先登录后查看你的书库。</div>';return}if(!r.ok)throw Error(d.error||'加载失败');const items=d.items||[];if(!items.length){app.innerHTML='<div class="empty">这里还没有作品。去搜索一本书加入书库吧。</div>';return}app.className='grid';app.innerHTML=items.map(x=>{const progress=Math.round(Number(x.progress||0)*100),cid=x.last_chapter_id;return `<article class="card">${x.cover_url?`<img class="cover" src="${esc(x.cover_url)}" loading="lazy">`:''}<div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.author||'未知作者')} · ${esc(x.library_status||'want')} ${x.favorite?'· ⭐':''}</div><p class="meta">${Number(x.chapter_count||0)} 章 ${x.last_chapter_title?'· 上次：'+esc(x.last_chapter_title):''}</p><div class="progress"><div class="bar" style="width:${progress}%"></div></div><div class="meta">阅读进度 ${progress}%</div><div class="actions"><a href="/work.html?id=${x.id}">详情</a>${cid?`<a href="/reader.html?work_id=${x.id}&chapter_id=${cid}">▶ 继续阅读</a>`:`<a href="/work.html?id=${x.id}">▶ 查看作品</a>`}<button onclick="remove(${x.id})">移除</button></div></div></article>`}).join('')}catch(e){app.innerHTML='<div class="empty err">'+esc(e.message)+'</div>'}}async function remove(id){if(!confirm('确定从书库移除？'))return;const r=await fetch('/api/library?work_id='+id,{method:'DELETE',credentials:'same-origin'});if(r.ok)load();else alert('移除失败')}document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-status],[data-favorite]').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;favorite='';load()});document.querySelectorAll('[data-favorite]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-status],[data-favorite]').forEach(x=>x.classList.remove('active'));b.classList.add('active');status='';favorite=b.dataset.favorite;load()});load();</script></body></html>
