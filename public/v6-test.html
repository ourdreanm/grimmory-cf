<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimmory CF V6</title><style>body{margin:0;background:#0b0f14;color:#e8edf3;font-family:system-ui;padding:30px}.box{max-width:900px;margin:auto}.card{background:#111720;border:1px solid #27313d;border-radius:12px;padding:16px;margin:12px 0;display:flex;gap:16px}.cover{width:80px;height:115px;object-fit:cover;background:#18212c}.muted{color:#91a0b0}button{background:#18212c;border:1px solid #344252;color:white;border-radius:8px;padding:8px 12px;cursor:pointer}a{color:#9cc8ff}</style></head><body><div class="box"><h1>📚 Grimmory CF V6</h1><p class="muted">在线小说搜索、加入书库、阅读入口测试页</p><input id="q" value="Sherlock Holmes" style="width:70%;padding:10px;background:#111720;color:white;border:1px solid #344252;border-radius:8px"><button onclick="search()">搜索</button><div id="out"></div></div><script>async function search(){const q=document.getElementById('q').value.trim();if(!q)return;const out=document.getElementById('out');out.innerHTML='<p>搜索中……</p>';try{const r=await fetch('/api/novels?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw Error(d.error||'搜索失败');out.innerHTML=(d.results||[]).map(x=>`<div class="card"><img class="cover" src="${x.cover_url||''}" onerror="this.style.display='none'"><div><h2>${esc(x.title)}</h2><div class="muted">${esc(x.author||'未知作者')} · ${esc(x.language||'')}</div><p>${esc(x.subjects?.slice(0,3).join(' · ')||'')}</p><button onclick="add(${Number(x.id.replace('gutendex:',''))})">⭐ 加入书库</button> <a href="/online-reader.html?id=${Number(x.id.replace('gutendex:',''))}" target="_blank">📖 直接阅读</a></div></div>`).join('')||'<p>没有结果</p>'}catch(e){out.innerHTML='<p>'+esc(e.message)+'</p>'}}async function add(id){const r=await fetch('/api/import-gutenberg',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});const d=await r.json();alert(r.ok?'已加入书库：'+d.title:(d.error||'加入失败'))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}search();</script></body></html>
