<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线阅读 · Grimmory CF</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(12px);border-bottom:1px solid #263047;z-index:5}.bar{max-width:1000px;margin:auto;padding:12px 16px;display:flex;gap:8px;align-items:center}.spacer{flex:1}button{background:#fff;color:#111827;border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}.ghost{background:#182238;color:#dbeafe;border:1px solid #34405a}button:disabled{opacity:.4;cursor:not-allowed}main{max-width:820px;margin:auto;padding:28px 18px 100px}.title{font-size:26px;margin:0 0 6px}.chapter{font-size:15px;color:#9ca3af;margin-bottom:25px}.content{font-size:19px;line-height:2;white-space:pre-wrap;word-break:break-word}.pages img{display:block;max-width:100%;margin:0 auto 15px;border-radius:5px}.empty{text-align:center;padding:50px;color:#9ca3af}.nav{display:flex;justify-content:space-between;gap:10px;margin:35px 0}.nav a{color:inherit;text-decoration:none}@media(max-width:600px){.content{font-size:17px;line-height:1.9}.title{font-size:22px}}</style></head><body><header><div class="bar"><a href="/"><button class="ghost">← 首页</button></a><a id="workLink"><button class="ghost">作品</button></a><div class="spacer"></div><button id="prev" class="ghost">上一章</button><button id="next" class="ghost">下一章</button></div></header><main><h1 id="title" class="title">加载中…</h1><div id="chapter" class="chapter"></div><article id="content" class="content"></article><div id="pages" class="pages"></div><div class="nav"><button id="prev2" class="ghost">← 上一章</button><button id="next2">下一章 →</button></div></main><script>const $=x=>document.getElementById(x),p=new URLSearchParams(location.search),workId=p.get('work_id')||p.get('id');let chapters=[],current=-1;async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function go(i){if(i<0||i>=chapters.length)return;location.href='/reader.html?work_id='+workId+'&chapter_id='+chapters[i].id}async function main(){if(!workId)throw Error('缺少 work_id');$('workLink').href='/work.html?id='+encodeURIComponent(workId);chapters=(await api('/api/chapters?work_id='+workId)).chapters||[];if(!chapters.length){$('title').textContent='暂无可阅读章节';$('content').innerHTML='<div class="empty">这个作品目前只有元数据，暂无站内章节内容。</div>';return}let cid=p.get('chapter_id');current=cid?chapters.findIndex(x=>String(x.id)===String(cid)):0;if(current<0)current=0;const d=await api('/api/chapters?work_id='+workId+'&chapter_id='+chapters[current].id),c=d.chapter;$('title').textContent=c.title;$('chapter').textContent='第 '+(current+1)+' / '+chapters.length+' 章';$('content').textContent=c.content||'';$('pages').innerHTML=(d.pages||[]).map(x=>'<img loading="lazy" src="'+String(x.image_url).replace(/"/g,'&quot;')+'">').join('');if(!c.content&&!(d.pages||[]).length)$('content').innerHTML='<div class="empty">本章暂时没有可直接阅读的内容。</div>';update();}function update(){const a=current>0,b=current<chapters.length-1;[$('prev'),$('prev2')].forEach(x=>{x.disabled=!a;x.onclick=()=>go(current-1)});[$('next'),$('next2')].forEach(x=>{x.disabled=!b;x.onclick=()=>go(current+1)})}let timer;window.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(async()=>{if(current<0||!chapters[current])return;const max=document.documentElement.scrollHeight-innerHeight,pos=max>0?scrollY/max:0;try{await api('/api/chapters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapter_id:Number(chapters[current].id),position:Math.min(Math.max(pos,0),1)})})}catch(e){}},500)});main().catch(e=>$('content').textContent='加载失败：'+e.message);</script></body></html>
