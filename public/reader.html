<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimmory 阅读器</title><style>body{margin:0;background:#0b1020;color:#eee;font-family:system-ui}header{padding:14px 18px;border-bottom:1px solid #29334a;position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(10px);z-index:2}.wrap{max-width:1100px;margin:auto;padding:18px}.reader{background:#111827;border:1px solid #29334a;border-radius:14px;padding:18px;min-height:60vh}.pdf{width:100%;height:75vh;border:0;border-radius:10px}.audio{width:100%;margin-top:30px}pre{white-space:pre-wrap;line-height:1.8}.hint{color:#9ca3af}</style></head><body><header>📖 <span id="title">Grimmory</span></header><main class="wrap"><div class="reader" id="reader">加载中……</div></main><script>const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);async function run(){if(!id)return $('reader').textContent='缺少 id';const r=await fetch('/api/reader/'+id);const b=await r.json();if(!r.ok)return $('reader').textContent=b.error||'加载失败';$('title').textContent=b.title;const u=b.stream_url;if(!u){$('reader').innerHTML='<p>这本书还没有文件。</p>';return}if(b.file_type==='pdf'){$('reader').innerHTML='<iframe class="pdf" src="'+u+'"></iframe>'}else if(['mp3','m4a','m4b','opus'].includes(b.file_type)){$('reader').innerHTML='<h2>'+b.title+'</h2><p class="hint">'+(b.author||'')+'</p><audio class="audio" controls src="'+u+'"></audio>'}else if(b.file_type==='epub'){$('reader').innerHTML='<h2>EPUB</h2><p>文件已就绪。当前版本提供文件打开/下载；完整浏览器 EPUB 排版阅读器将在后续版本接入。</p><a href="'+u+'" target="_blank">打开 EPUB</a>'}else{$('reader').innerHTML='<p>当前格式：'+b.file_type+'</p><a href="'+u+'" target="_blank">打开 / 下载文件</a>'}}run()</script></body></html>
