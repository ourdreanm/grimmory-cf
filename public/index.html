<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimmory CF · 在线小说漫画书库</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f4f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1020ed;backdrop-filter:blur(12px);border-bottom:1px solid #263047}.nav,main{max-width:1200px;margin:auto}.nav{padding:15px 20px;display:flex;align-items:center;gap:9px}.brand{font-size:21px;font-weight:800}.spacer{flex:1}.muted{color:#9ca3af}.wrap{padding:25px 20px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input{background:#111827;color:#fff;border:1px solid #34405a;border-radius:10px;padding:11px 13px;flex:1;min-width:220px}button{background:#fff;color:#111827;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.ghost{background:#182238;color:#dbeafe;border:1px solid #34405a}.danger{background:#7f1d1d;color:white}.hidden{display:none!important}.hero{padding:15px 18px;border:1px solid #263047;background:#10182a;border-radius:14px;margin-bottom:18px}.stats{color:#94a3b8;font-size:13px;margin-top:7px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.filter{background:#111827;color:#cbd5e1;border:1px solid #263047;padding:7px 11px;border-radius:99px;font-size:13px}.filter.active{background:#dbeafe;color:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}.card{background:#121a2d;border:1px solid #263047;border-radius:15px;padding:15px;display:flex;flex-direction:column;min-width:0}.cover{height:230px;border-radius:10px;background:#1b263e;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:13px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pill{border:1px solid #34405a;border-radius:99px;padding:3px 8px;font-size:12px}.desc{font-size:13px;line-height:1.55;min-height:40px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:12px}.actions a{text-decoration:none}.source{font-size:12px;color:#94a3b8;margin-top:7px}.section{margin-top:30px}.section h2{font-size:20px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{background:#111827;border:1px solid #34405a;border-radius:16px;padding:22px;width:min(520px,100%)}.field{margin:12px 0}.field label{display:block;color:#aab4c5;font-size:13px;margin-bottom:6px}.field input{width:100%}.notice{background:#172036;border-radius:10px;padding:11px;margin:10px 0}@media(max-width:600px){.wrap{padding:18px 13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{padding:11px}.cover{height:175px}.brand{font-size:18px}.toolbar input{min-width:140px}}
</style></head><body><header><div class="nav"><div class="brand">📚 Grimmory CF</div><div class="spacer"></div><span id="who" class="muted"></span><button class="ghost" id="auth">登录</button><button class="ghost hidden" id="upload">上传</button></div></header><main class="wrap"><div class="toolbar"><input id="q" placeholder="搜索小说、漫画、书名、作者……"><button onclick="search()">🔎 搜索</button><button class="ghost" onclick="showLibrary()">📚 我的书架</button><button class="ghost" onclick="home()">首页</button></div><div id="hero" class="hero hidden"></div><div id="filters" class="filters hidden"></div><div id="status" class="muted">正在加载…</div><section id="results" class="grid"></section><section id="library" class="section hidden"><h2>📚 我的书架</h2><div class="filters"><button class="filter active" onclick="showLibrary()">全部</button><button class="filter" onclick="showLibrary('reading')">阅读中</button><button class="filter" onclick="showLibrary('want')">想看</button><button class="filter" onclick="showLibrary('completed')">已完成</button></div><div id="libGrid" class="grid"></div></section></main><div class="modal" id="authModal"><div class="box"><h2 id="authTitle">登录</h2><div id="notice"></div><div class="field"><label>用户名</label><input id="username"></div><div class="field"><label>密码</label><input id="password" type="password"></div><div class="actions"><button onclick="submitAuth()" id="authSubmit">登录</button><button class="ghost" onclick="toggleAuth()" id="authSwitch">注册</button><button class="ghost" onclick="closeM('authModal')">关闭</button></div></div></div><div class="modal" id="uploadModal"><div class="box"><h2>上传本地书籍</h2><div class="field"><label>文件</label><input id="file" type="file"></div><div class="field"><label>书名</label><input id="title" placeholder="不填则使用文件名"></div><div class="field"><label>作者</label><input id="author"></div><div class="actions"><button onclick="doUpload()">开始上传</button><button class="ghost" onclick="closeM('uploadModal')">取消</button></div><p id="uploadStatus" class="muted"></p></div></div><script>let me=null,registering=false,items=[],type='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function closeM(x){$(x).classList.remove('show')}function openM(x){$(x).classList.add('show')}function typeName(x){return x==='novel'?'小说':x==='comic'?'漫画':'书籍'}async function meLoad(){try{me=(await api('/api/auth/me')).user}catch(e){me=null}$('who').textContent=me?me.username+' · '+me.role:'';$('auth').textContent=me?'退出':'登录';$('upload').classList.toggle('hidden',me?.role!=='ADMIN')}function card(b){const local=b.source==='local';return '<article class="card"><div class="cover">'+(b.cover_url?'<img loading="lazy" src="'+esc(b.cover_url)+'">':'📚')+'</div><div class="badges"><span class="pill">'+typeName(b.type)+'</span><span class="pill">'+esc(b.source_name||'未知来源')+'</span><span class="pill">'+(b.available?'● 可访问':'○ 仅目录')+'</span></div><h3>'+esc(b.title)+'</h3><div class="muted">'+esc(b.author||'未知作者')+'</div>'+(b.year?'<div class="source">'+esc(b.year)+(b.publisher?' · '+esc(b.publisher):'')+'</div>':'')+'<p class="muted desc">'+esc((b.description||'暂无简介').replace(/<[^>]+>/g,'').slice(0,130))+'</p><div class="actions">'+(local&&b.file_key?'<a href="/reader.html?id='+encodeURIComponent(b.id)+'"><button>阅读文件</button></a>':'')+(b.url?'<button class="ghost" onclick="addWork('+JSON.stringify(b).replace(/</g,'\\u003c')+')">加入/查看</button>':'')+(local&&me?.role==='ADMIN'?'<button class="danger" onclick="delBook('+Number(b.id)+')">删除</button>':'')+'</div></article>'}async function search(){const q=$('q').value.trim();$('library').classList.add('hidden');$('results').classList.remove('hidden');if(!q)return home();$('status').textContent='正在搜索「'+q+'」…';try{const d=await api('/api/search?q='+encodeURIComponent(q)+'&limit=20');items=d.results||[];type='all';$('hero').classList.remove('hidden');$('hero').innerHTML='<b>🔎 「'+esc(q)+'」</b><div class="stats">共 '+d.count+' 条 · '+(d.sources||[]).map(x=>esc(x.name)+' '+x.count).join(' · ')+'</div>';render()}catch(e){$('status').textContent='搜索失败：'+e.message}}function render(){const c={all:items.length,book:0,novel:0,comic:0};items.forEach(x=>c[x.type]++);$('filters').classList.toggle('hidden',!items.length);$('filters').innerHTML=[['all','全部'],['novel','小说'],['comic','漫画'],['book','书籍']].filter(x=>c[x[0]]).map(x=>'<button class="filter '+(type===x[0]?'active':'')+'" onclick="type=\''+x[0]+'\';render()">'+x[1]+' '+c[x[0]]+'</button>').join('');const a=type==='all'?items:items.filter(x=>x.type===type);$('results').innerHTML=a.map(card).join('')||'<p class="muted">没有结果</p>';$('status').textContent=''}async function addWork(b){if(!me){openM('authModal');return}try{const d=await api('/api/works',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:b.title,type:b.type,subtitle:b.subtitle,author:b.author,description:b.description,cover_url:b.cover_url,language:b.language,status:b.status,year:b.year,categories:b.categories,source_name:b.source_name,external_id:b.id,url:b.url,metadata:b})});location.href='/work.html?id='+d.work_id}catch(e){alert(e.message)}}async function showLibrary(status=''){if(!me){openM('authModal');return}$('hero').classList.add('hidden');$('filters').classList.add('hidden');$('results').classList.add('hidden');$('library').classList.remove('hidden');try{const d=await api('/api/library?limit=100'+(status?'&status='+status:''));$('libGrid').innerHTML=(d.items||[]).map(b=>'<article class="card"><div class="cover">'+(b.cover_url?'<img src="'+esc(b.cover_url)+'">':'📚')+'</div><div class="badges"><span class="pill">'+typeName(b.type)+'</span><span class="pill">'+esc(b.library_status==='reading'?'阅读中':b.library_status==='completed'?'已完成':'想看')+'</span></div><h3>'+esc(b.title)+'</h3><div class="muted">'+esc(b.author||'未知作者')+'</div>'+(b.last_chapter_title?'<div class="source">上次：'+esc(b.last_chapter_title)+'</div>':'')+'<div class="actions"><a href="/work.html?id='+b.id+'"><button>进入作品</button></a>'+(b.last_chapter_id?'<a href="/reader.html?work_id='+b.id+'&chapter_id='+b.last_chapter_id+'"><button class="ghost">继续阅读</button></a>':'')+'</div></article>').join('')||'<p class="muted">书架为空。</p>'}catch(e){$('libGrid').innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}function home(){$('q').value='';$('library').classList.add('hidden');$('results').classList.remove('hidden');$('hero').classList.add('hidden');$('filters').classList.add('hidden');api('/api/books').then(d=>{items=(d.items||[]).map(b=>({...b,type:'book',source:'local',source_name:'我的书库',available:Boolean(b.file_key)}));$('status').textContent='本地书库 · '+items.length+' 本';$('results').innerHTML=items.map(card).join('')||'<p class="muted">本地书库为空，可搜索在线资源。</p>'}).catch(e=>$('status').textContent=e.message)}function toggleAuth(){registering=!registering;$('authTitle').textContent=registering?'注册':'登录';$('authSubmit').textContent=registering?'注册':'登录';$('authSwitch').textContent=registering?'返回登录':'注册';$('notice').innerHTML=registering?'<div class="notice">第一个注册用户自动成为管理员。</div>':''}async function submitAuth(){try{const d=await api(registering?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});closeM('authModal');await meLoad();home();if(d.firstAdmin)alert('注册成功，你是管理员。')}catch(e){$('notice').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}$('auth').onclick=async()=>{if(me){await api('/api/auth/logout',{method:'POST'});await meLoad();return home()}registering=false;toggleAuth();openM('authModal')};$('upload').onclick=()=>openM('uploadModal');async function doUpload(){const f=$('file').files[0];if(!f)return alert('请选择文件');try{$('uploadStatus').textContent='上传中…';const fd=new FormData();fd.append('file',f);const x=await api('/api/upload',{method:'POST',body:fd});await api('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value||f.name,author:$('author').value,file_type:x.type,file_size:x.size,file_key:x.key})});closeM('uploadModal');home()}catch(e){$('uploadStatus').textContent=e.message}}$('q').onkeydown=e=>{if(e.key==='Enter')search()};(async()=>{await meLoad();home()})();</script></body></html>
