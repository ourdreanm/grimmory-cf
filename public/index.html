<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📚 Grimmory CF</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#10161eee;backdrop-filter:blur(12px);border-bottom:1px solid #27313d;padding:14px 18px;display:flex;align-items:center;gap:12px}.brand{font-size:20px;font-weight:800}.user{margin-left:auto;color:#9aa7b5;font-size:13px}.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}.hero{padding:28px 0 20px}.hero h1{font-size:34px;margin:0 0 8px}.muted{color:#8f9dad}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;min-width:0;background:#111720;border:1px solid #344252;color:#fff;border-radius:10px;padding:13px 15px;font-size:16px}.btn{border:1px solid #344252;background:#18212c;color:#e8edf3;border-radius:10px;padding:11px 15px;cursor:pointer}.btn:hover{background:#202c3a}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.tab.active{border-color:#6c7f94;background:#243140}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#111720;border:1px solid #27313d;border-radius:13px;padding:14px;min-height:160px;display:flex;gap:13px}.cover{width:82px;height:118px;object-fit:cover;border-radius:7px;background:#18212c;flex:none}.card h3{margin:0 0 7px;font-size:16px}.card p{font-size:13px;line-height:1.6;color:#aeb9c5;margin:7px 0}.meta{font-size:12px;color:#8492a2}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty,.loading{padding:35px;text-align:center;color:#8795a5;border:1px dashed #33404e;border-radius:12px}.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 13px}.section-title h2{margin:0;font-size:20px}.pill{font-size:11px;border:1px solid #3a4654;border-radius:99px;padding:3px 7px;color:#aab6c2}.danger{color:#ff9b9b}.ok{color:#8fd8aa}@media(max-width:600px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr}.search{flex-direction:column}}
</style></head><body>
<header class="top"><div class="brand">📚 Grimmory CF</div><div class="user" id="user">正在检查登录状态…</div><a class="btn" href="/admin-sources.html">⚙ 数据源</a></header>
<main class="wrap"><section class="hero"><h1>发现你的下一本书</h1><div class="muted">搜索书籍、小说和漫画；公共领域小说可直接在线阅读。</div><div class="search"><input id="q" placeholder="搜索书名、作者、ISBN、小说、漫画……" autocomplete="off"><button class="btn" id="go">🔎 搜索</button></div><div class="tabs"><button class="btn tab active" data-type="all">全部</button><button class="btn tab" data-type="book">书籍</button><button class="btn tab" data-type="novel">小说</button><button class="btn tab" data-type="comic">漫画</button></div></section>
<section><div class="section-title"><h2>搜索结果</h2><span class="pill" id="count">0</span></div><div id="results" class="grid"><div class="empty">输入关键词开始搜索</div></div></section>
<section><div class="section-title"><h2>我的书库</h2><span class="pill">登录后可用</span></div><div id="library" class="grid"><div class="empty">登录后可以查看已收藏作品。</div></div></section></main>
<script>
const $=s=>document.querySelector(s);let type='all';let results=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function gid(x){return Number(String(x.id||'').replace(/^gutendex:/,''))}
function card(x){const isGut=String(x.id||'').startsWith('gutendex:')||x.source_name?.includes('Gutenberg');const id=isGut?gid(x):0;return `<article class="card">${x.cover_url?`<img class="cover" src="${esc(x.cover_url)}" loading="lazy" onerror="this.style.display='none'">`:''}<div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.author||'未知作者')} ${x.year?'· '+esc(x.year):''}</div><p>${esc(x.description||x.subjects?.slice(0,3).join(' · ')||'暂无简介')}</p><div class="meta">来源：${esc(x.source_name||'未知')} ${x.available_text?' · 可在线阅读':''}</div><div class="actions">${id?`<button class="btn" onclick="add(${id})">⭐ 加入书库</button><a class="btn" href="/online-reader.html?id=${id}">📖 阅读</a>`:`<button class="btn" onclick="addGeneric(${JSON.stringify(x).replace(/"/g,'&quot;')})">⭐ 加入书库</button>`}${x.source_url?`<a class="btn" href="${esc(x.source_url)}" target="_blank" rel="noopener">原站</a>`:''}</div></div></article>`}
async function search(){const q=$('#q').value.trim();if(!q){$('#results').innerHTML='<div class="empty">请输入关键词。</div>';return}$('#results').innerHTML='<div class="loading">正在搜索……</div>';try{const urls=[];if(type==='all'||type==='novel')urls.push('/api/novels?q='+encodeURIComponent(q));if(type==='all'||type==='book'||type==='comic')urls.push('/api/search?q='+encodeURIComponent(q)+'&type='+encodeURIComponent(type==='all'?'book':type));const all=[];for(const u of urls){const r=await fetch(u);if(r.ok){const d=await r.json();all.push(...(d.results||[]).map(x=>({...x,_kind:x.source_name?.includes('Gutenberg')?'novel':(x.type||type)})))}}results=all;render();}catch(e){$('#results').innerHTML='<div class="empty danger">搜索失败：'+esc(e.message)+'</div>'}}
function render(){let arr=results;if(type!=='all')arr=arr.filter(x=>(x._kind||x.type||'book')===type);$('#count').textContent=arr.length;$('#results').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">没有找到相关内容。</div>'}
async function add(id){try{const r=await fetch('/api/import-gutenberg',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});const d=await r.json();if(r.status===401){alert('请先登录');return}alert(r.ok?'已加入书库：'+d.title:(d.error||'加入失败'));loadLibrary()}catch(e){alert(e.message)}}
async function addGeneric(x){alert('该来源目前仅保存元数据。后续会为授权来源增加一键导入。')}
async function loadLibrary(){try{const r=await fetch('/api/library');if(!r.ok)return;const d=await r.json();const arr=d.items||d.library||[];$('#library').innerHTML=arr.length?arr.map(x=>`<article class="card"><img class="cover" src="${esc(x.cover_url||'')}" onerror="this.style.display='none'"><div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.author||'未知作者')} · ${esc(x.status||'want')}</div><p>阅读进度：${Math.round(Number(x.progress||0)*100)}%</p>${x.source_url?`<a class="btn" href="${esc(x.source_url)}" target="_blank">打开来源</a>`:''}</div></article>`).join(''):'<div class="empty">你的书库还是空的。</div>'}catch{}}
async function who(){try{const r=await fetch('/api/me');if(r.ok){const d=await r.json();$('#user').textContent=d.user?.username||d.username||'已登录'}else $('#user').textContent='未登录'}}catch{$('#user').textContent='未登录'}}
$('#go').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;if($('#q').value.trim())search()});who();loadLibrary();
</script></body></html>
