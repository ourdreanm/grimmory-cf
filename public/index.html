<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📚 Grimmory CF</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#10161eee;backdrop-filter:blur(12px);border-bottom:1px solid #27313d;padding:14px 18px;display:flex;align-items:center;gap:12px}.brand{font-size:20px;font-weight:800}.user{margin-left:auto;color:#9aa7b5;font-size:13px}.btn{border:1px solid #344252;background:#18212c;color:#e8edf3;border-radius:10px;padding:11px 15px;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:#202c3a}.top .btn{white-space:nowrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.tab.active{border-color:#6c7f94;background:#243140}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#111720;border:1px solid #27313d;border-radius:13px;padding:14px;min-height:160px;display:flex;gap:13px}.cover{width:82px;height:118px;object-fit:cover;border-radius:7px;background:#18212c;flex:none}.card h3{margin:0 0 7px;font-size:16px}.card p{font-size:13px;line-height:1.6;color:#aeb9c5;margin:7px 0}.meta{font-size:12px;color:#8492a2}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty,.loading{padding:35px;text-align:center;color:#8795a5;border:1px dashed #33404e;border-radius:12px}.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 13px}.section-title h2{margin:0;font-size:20px}.pill{font-size:11px;border:1px solid #3a4654;border-radius:99px;padding:3px 7px;color:#aab6c2}.danger{color:#ff9b9b}.ok{color:#8fd8aa}.status{min-height:20px;margin-top:8px}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;min-width:0;background:#111720;border:1px solid #344252;color:#fff;border-radius:10px;padding:13px 15px;font-size:16px}.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}.hero{padding:28px 0 20px}.hero h1{font-size:34px;margin:0 0 8px}.muted{color:#8f9dad}@media(max-width:600px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr}.search{flex-direction:column}.top{gap:7px;padding:11px}.brand{font-size:17px}.user{font-size:12px}.top .btn{padding:9px 10px;font-size:13px}}</style></head><body><header class="top"><div class="brand">📚 Grimmory CF</div><div class="user" id="user">未登录</div><a class="btn" id="auth" href="/login.html">🔐 登录 / 注册</a><a class="btn" href="/library.html">📚 我的书库</a></header><main class="wrap"><section class="hero"><h1>发现你的下一本书</h1><div class="muted">搜索书籍、小说和漫画；公共领域小说可直接在线阅读。</div><div class="search"><input id="q" placeholder="搜索书名、作者、ISBN、小说、漫画……" autocomplete="off"><button class="btn" id="go" type="button">🔎 搜索</button></div><div class="tabs"><button class="btn tab active" data-type="all" type="button">全部</button><button class="btn tab" data-type="book" type="button">书籍</button><button class="btn tab" data-type="novel" type="button">小说</button><button class="btn tab" data-type="comic" type="button">漫画</button></div><div id="status" class="status"></div></section><section><div class="section-title"><h2>搜索结果</h2><span class="pill" id="count">0</span></div><div id="results" class="grid"><div class="empty">输入关键词开始搜索</div></div></section></main><script>const $=s=>document.querySelector(s);let type='all',results=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function workLink(x){const wid=x.work_id||x.id;return x.source_name?.includes('Gutenberg')?`/online-reader.html?id=${encodeURIComponent(String(wid).replace('gutendex:',''))}`:`/work.html?source=${encodeURIComponent(x.source_name||'')}&id=${encodeURIComponent(wid)}`}function card(x){const isGut=String(x.id||'').startsWith('gutendex:')||x.source_name?.includes('Gutenberg');const gid=isGut?Number(String(x.id).replace('gutendex:','')):0;const sourceUrl=x.source_url||x.url||'';return `<article class="card">${x.cover_url?`<img class="cover" src="${esc(x.cover_url)}" loading="lazy" onerror="this.style.display='none'">`:''}<div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.author||'未知作者')} ${x.year?'· '+esc(x.year):''}</div><p>${esc(x.description||x.subjects?.slice(0,3).join(' · ')||x.categories?.slice(0,3).join(' · ')||'暂无简介')}</p><div class="meta">来源：${esc(x.source_name||'未知')} ${x.available_text||x.available?' · 可在线阅读':''}</div><div class="actions"><a class="btn" href="${esc(workLink(x))}">📕 作品详情</a>${gid?`<button class="btn" onclick="add(${gid})">⭐ 加入书库</button>`:''}${sourceUrl?`<a class="btn" href="${esc(sourceUrl)}" target="_blank" rel="noopener">原站</a>`:''}</div></div></article>`}async function getJson(u){const r=await fetch(u,{headers:{accept:'application/json'},cache:'no-store'});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(`${u} 返回 HTTP ${r.status}${d?.error?`：${d.error}`:''}`);return d||{results:[]}}async function search(){const q=$('#q').value.trim();if(!q){$('#results').innerHTML='<div class="empty">请输入关键词。</div>';$('#count').textContent='0';$('#status').textContent='';return}$('#results').innerHTML='<div class="loading">正在搜索……</div>';$('#status').textContent='正在查询搜索源……';const requests=[];requests.push(getJson('/api/search?q='+encodeURIComponent(q)+'&limit=10&type='+encodeURIComponent(type==='all'?'book':type)));if(type==='novel')requests.push(getJson('/api/novels?q='+encodeURIComponent(q)+'&limit=10'));const settled=await Promise.allSettled(requests);const all=[];const errors=[];for(const item of settled){if(item.status==='fulfilled')all.push(...(item.value.results||[]));else errors.push(item.reason?.message||'搜索接口失败')}results=all.map(x=>({...x,_kind:String(x.id||'').startsWith('gutendex:')||x.source_name?.includes('Gutenberg')?'novel':(x.type||'book')}));render();$('#status').className=errors.length?'status danger':'status ok';$('#status').textContent=errors.length?'部分搜索源不可用：'+errors.join('；'):`搜索完成，共找到 ${results.length} 条结果。`}
function render(){let arr=results;if(type!=='all')arr=arr.filter(x=>(x._kind||x.type||'book')===type);$('#count').textContent=arr.length;$('#results').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">没有找到相关内容。</div>'}async function add(id){try{const r=await fetch('/api/import-gutenberg',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({id})});const d=await r.json();if(r.status===401){alert('请先登录');return}alert(r.ok?'已加入书库：'+d.title:(d.error||'加入失败'))}catch(e){alert(e.message)}}async function who(){try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.ok&&d.user){$('#user').textContent='👤 '+d.user.username;$('#auth').textContent='退出登录';$('#auth').href='#';$('#auth').onclick=async e=>{e.preventDefault();await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.reload()}}else{$('#user').textContent='未登录';$('#auth').textContent='🔐 登录 / 注册';$('#auth').href='/login.html?next='+encodeURIComponent(location.pathname+location.search)}}catch{$('#user').textContent='未登录'}}$('#go').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;if($('#q').value.trim())search()});who();</script></body></html>
