<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Grimmory CF</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f4f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1020ed;backdrop-filter:blur(12px);border-bottom:1px solid #263047}.nav,main{max-width:1200px;margin:auto}.nav{padding:15px 20px;display:flex;align-items:center;gap:10px}.brand{font-size:21px;font-weight:800}.spacer{flex:1}.muted{color:#9ca3af}.wrap{padding:25px 20px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 24px}input{background:#111827;color:#fff;border:1px solid #34405a;border-radius:10px;padding:11px 13px;flex:1;min-width:220px}button{background:#fff;color:#111827;border:0;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.ghost{background:#182238;color:#dbeafe;border:1px solid #34405a}.danger{background:#7f1d1d;color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}.card{background:#121a2d;border:1px solid #263047;border-radius:15px;padding:15px;overflow:hidden}.cover{height:190px;border-radius:10px;background:#1b263e;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:13px}.cover img{width:100%;height:100%;object-fit:cover}.card h3{margin:0 0 5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions a{text-decoration:none}.pill{display:inline-block;border:1px solid #34405a;border-radius:99px;padding:3px 8px;font-size:12px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{background:#111827;border:1px solid #34405a;border-radius:16px;padding:22px;width:min(520px,100%)}.field{margin:12px 0}.field label{display:block;color:#aab4c5;font-size:13px;margin-bottom:6px}.field input{width:100%}.notice{background:#172036;border-radius:10px;padding:11px;margin:10px 0}@media(max-width:600px){.wrap{padding:18px 13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{padding:11px}.cover{height:150px}.brand{font-size:18px}}</style></head><body><header><div class="nav"><div class="brand">📚 Grimmory CF</div><div class="spacer"></div><span id="who" class="muted"></span><button class="ghost" id="authBtn">登录</button><button class="ghost hidden" id="uploadBtn">上传</button></div></header><main class="wrap"><div class="toolbar"><input id="q" placeholder="搜索书名、作者、ISBN、出版社……"><button id="searchBtn">搜索</button><button class="ghost" id="refresh">刷新</button></div><div id="status" class="muted">加载中…</div><section id="books" class="grid"></section></main><div class="modal" id="authModal"><div class="box"><h2 id="authTitle">登录</h2><div id="notice"></div><div class="field"><label>用户名</label><input id="username"></div><div class="field"><label>密码</label><input id="password" type="password"></div><div class="actions"><button id="submitAuth">登录</button><button class="ghost" id="switch">注册</button><button class="ghost" onclick="closeM('authModal')">关闭</button></div></div></div><div class="modal" id="uploadModal"><div class="box"><h2>上传书籍</h2><div class="notice">V3 当前先提供稳定上传；超过 90MB 的大型文件请等待 R2 直传模块。</div><div class="field"><label>文件</label><input id="file" type="file"></div><div class="field"><label>书名</label><input id="title" placeholder="不填则使用文件名"></div><div class="field"><label>作者</label><input id="author"></div><div class="actions"><button id="doUpload">开始上传</button><button class="ghost" onclick="closeM('uploadModal')">取消</button></div><p id="uploadStatus" class="muted"></p></div></div><script>let me=null,registering=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function closeM(id){$(id).classList.remove('show')}function openM(id){$(id).classList.add('show')}async function loadMe(){me=(await api('/api/auth/me')).user;$('who').textContent=me?me.username+' · '+me.role:'';$('authBtn').textContent=me?'退出':'登录';$('uploadBtn').classList.toggle('hidden',me?.role!=='ADMIN')}async function load(){try{const q=$('q').value.trim(),d=await api('/api/books'+(q?'?q='+encodeURIComponent(q):''));$('status').textContent='共 '+d.items.length+' 本';$('books').innerHTML=(d.items||[]).map(b=>'<article class="card"><div class="cover">'+(b.cover_key?'<img src="/api/file/'+encodeURIComponent(b.cover_key)+'">':'📚')+'</div><h3>'+esc(b.title)+'</h3><div class="muted">'+esc(b.author||'未知作者')+'</div><p class="muted">'+esc((b.description||'').slice(0,90))+'</p><span class="pill">'+esc(b.file_type||'无文件')+'</span><div class="actions">'+(b.file_key?'<a href="/reader.html?id='+b.id+'"><button>阅读</button></a><a href="/api/file/'+encodeURIComponent(b.file_key)+'" target="_blank"><button class="ghost">文件</button></a>':'')+(me?'<button class="ghost" onclick="fav('+b.id+')">❤️</button>':'')+(me?.role==='ADMIN'?'<button class="danger" onclick="delBook('+b.id+')">删除</button>':'')+'</div></article>').join('')||'<p class="muted">书库为空</p>'}catch(e){$('status').textContent=e.message}}async function fav(id){try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book_id:id})})}catch(e){alert(e.message)}}async function delBook(id){if(!confirm('确定删除？'))return;try{await api('/api/books/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}$('authBtn').onclick=async()=>{if(me){await api('/api/auth/logout',{method:'POST'});await loadMe();return load()}registering=false;renderAuth();openM('authModal')};function renderAuth(){$('authTitle').textContent=registering?'注册':'登录';$('submitAuth').textContent=registering?'注册':'登录';$('switch').textContent=registering?'返回登录':'注册';$('notice').innerHTML=registering?'<div class="notice">第一个注册用户会自动成为管理员。</div>':''}$('switch').onclick=()=>{registering=!registering;renderAuth()};$('submitAuth').onclick=async()=>{try{const d=await api(registering?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});closeM('authModal');await loadMe();await load();if(d.firstAdmin)alert('注册成功，你是管理员。')}catch(e){$('notice').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}};$('uploadBtn').onclick=()=>openM('uploadModal');$('doUpload').onclick=async()=>{const f=$('file').files[0];if(!f)return alert('请选择文件');try{$('uploadStatus').textContent='上传中…';const fd=new FormData();fd.append('file',f);const x=await api('/api/upload',{method:'POST',body:fd});await api('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value||f.name,author:$('author').value,file_type:x.type,file_size:x.size,file_key:x.key})});closeM('uploadModal');$('file').value='';load()}catch(e){$('uploadStatus').textContent=e.message}};$('searchBtn').onclick=load;$('refresh').onclick=()=>{ $('q').value='';load()};$('q').onkeydown=e=>{if(e.key==='Enter')load()};(async()=>{await loadMe();await load()})();</script></body></html>
