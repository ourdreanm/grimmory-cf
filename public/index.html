<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimmory CF</title><style>body{margin:0;background:#0b1020;color:#eee;font-family:system-ui;padding:25px}main{max-width:1100px;margin:auto}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input{padding:12px;border-radius:9px;border:1px solid #39445d;background:#111827;color:white}button{padding:11px 15px;border:0;border-radius:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.card{background:#121a2d;border:1px solid #263047;border-radius:14px;padding:16px}.muted{color:#9ca3af}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}.modal.on{display:flex}.box{background:#111827;padding:22px;border-radius:15px;width:min(420px,90%)}.field{margin:12px 0}.field input{width:100%;box-sizing:border-box}</style></head><body><main><h1>📚 Grimmory CF</h1><p class="muted">Cloudflare Pages + D1 + R2</p><div class="bar"><input id="q" placeholder="搜索书名、作者、ISBN"><button onclick="load()">搜索</button><button id="login" onclick="auth()">登录</button><button id="up" style="display:none" onclick="openUp()">上传书籍</button></div><p id="status" class="muted"></p><div id="books" class="grid"></div></main><div id="modal" class="modal"><div class="box"><h2 id="mt">登录</h2><div class="field"><input id="user" placeholder="用户名"></div><div class="field"><input id="pass" type="password" placeholder="密码（至少8位）"></div><button onclick="submitAuth()">提交</button> <button onclick="toggle()">关闭</button><button onclick="reg()">切换注册</button></div></div><div id="upload" class="modal"><div class="box"><h2>上传书籍</h2><div class="field"><input id="file" type="file"></div><div class="field"><input id="title" placeholder="书名"></div><div class="field"><input id="author" placeholder="作者"></div><button onclick="upload()">上传</button> <button onclick="document.getElementById('upload').classList.remove('on')">关闭</button><p id="us" class="muted"></p></div></div><script>let me=null,registering=false;const $=x=>document.getElementById(x);async function api(u,o={}){let r=await fetch(u,{credentials:'same-origin',...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.status);return d}async function who(){me=(await api('/api/auth/me')).user;if(me){$('login').textContent='退出 '+me.username;if(me.role==='ADMIN')$('up').style.display='inline-block'}else{$('login').textContent='登录';$('up').style.display='none'}}async function load(){let d=await api('/api/books'+($('q').value?'?q='+encodeURIComponent($('q').value):''));$('status').textContent='共 '+d.items.length+' 本';$('books').innerHTML=d.items.map(b=>'<article class="card"><h3>'+esc(b.title)+'</h3><p class="muted">'+esc(b.author||'未知作者')+'</p><p>'+esc((b.description||'').slice(0,120))+'</p>'+(b.file_key?'<a target="_blank" href="/api/file/'+encodeURIComponent(b.file_key)+'">打开文件</a>':'')+'</article>').join('')||'<p class="muted">书库为空</p>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toggle(){ $('modal').classList.toggle('on')}function auth(){if(me){api('/api/auth/logout',{method:'POST'}).then(()=>{who();load()});return}registering=false;$('mt').textContent='登录';toggle()}function reg(){registering=!registering;$('mt').textContent=registering?'注册':'登录'}async function submitAuth(){try{await api(registering?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});toggle();await who();load()}catch(e){alert(e.message)}}function openUp(){$('upload').classList.add('on')}async function upload(){let f=$('file').files[0];if(!f)return alert('选择文件');try{$('us').textContent='上传中…';let fd=new FormData();fd.append('file',f);let x=await api('/api/upload',{method:'POST',body:fd});await api('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value||f.name,author:$('author').value,file_type:x.type,file_size:x.size,file_key:x.key})});$('upload').classList.remove('on');load()}catch(e){$('us').textContent=e.message}}(async()=>{await who();await load()})()</script></body></html>
