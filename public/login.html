<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Grimmory CF</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0f14;color:#e8edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#111720;border:1px solid #27313d;border-radius:18px;padding:26px;box-shadow:0 18px 60px #0006}.brand{text-align:center;font-size:25px;font-weight:800;margin-bottom:8px}.sub{text-align:center;color:#8f9dad;font-size:13px;margin-bottom:22px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;border:1px solid #344252;background:#18212c;color:#cbd5e1;border-radius:10px;padding:10px;cursor:pointer}.tab.active{background:#243140;color:#fff;border-color:#6c7f94}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#aeb9c5;margin-bottom:7px}.field input{width:100%;background:#0d131b;border:1px solid #344252;color:#fff;border-radius:10px;padding:12px 13px;font-size:16px;outline:none}.field input:focus{border-color:#7890aa}.submit{width:100%;margin-top:8px;border:0;border-radius:10px;padding:12px;background:#e8edf3;color:#111720;font-size:16px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.5;cursor:wait}.msg{min-height:22px;margin:13px 0 0;text-align:center;font-size:13px;color:#ffb4b4}.back{display:block;text-align:center;margin-top:18px;color:#9cc8ff;text-decoration:none;font-size:13px}</style></head><body><main class="box"><div class="brand">📚 Grimmory CF</div><div class="sub">登录后即可使用我的书库与阅读进度同步</div><div class="tabs"><button class="tab active" id="loginTab" type="button">登录</button><button class="tab" id="registerTab" type="button">注册</button></div><form id="form"><div class="field"><label>用户名</label><input id="username" autocomplete="username" required minlength="3" maxlength="32"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div><button class="submit" id="submit" type="submit">登录</button></form><div class="msg" id="msg"></div><a class="back" id="back" href="/">← 返回首页</a></main><script>const $=s=>document.querySelector(s);let mode='login';const params=new URLSearchParams(location.search);const next=params.get('next')||'/';function setMode(x){mode=x;$('#loginTab').classList.toggle('active',x==='login');$('#registerTab').classList.toggle('active',x==='register');$('#submit').textContent=x==='login'?'登录':'注册';$('#password').autocomplete=x==='login'?'current-password':'new-password';$('#msg').textContent=''}$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');$('#form').onsubmit=async e=>{e.preventDefault();const btn=$('#submit');btn.disabled=true;btn.textContent=mode==='login'?'登录中…':'注册中…';$('#msg').textContent='';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('请求失败 HTTP '+r.status));location.href=next.startsWith('/')?next:'/'}catch(err){$('#msg').textContent=err.message||'操作失败';btn.disabled=false;btn.textContent=mode==='login'?'登录':'注册'}};fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.user)$('#msg').textContent='当前已登录：'+d.user.username}).catch(()=>{});</script></body></html>
