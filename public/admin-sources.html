<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimmory CF · 资源源管理</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#121a2d;border:1px solid #29334a;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{background:#0f172a;color:#fff;border:1px solid #34405a;border-radius:9px;padding:10px}input{min-width:220px;flex:1}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.muted{color:#9ca3af}.ok{color:#86efac}.off{color:#fca5a5}.source{display:grid;grid-template-columns:1fr 100px 100px 100px;gap:10px;align-items:center}@media(max-width:650px){.source{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>⚙️ 资源源管理</h1><p class="muted">管理员页面。这里管理可用于作品聚合的来源；不会绕过登录、验证码、反爬或 DRM。</p><div class="card"><h2>添加来源</h2><div class="row"><input id="name" placeholder="来源名称"><select id="type"><option value="mixed">综合</option><option value="novel">小说</option><option value="comic">漫画</option><option value="book">书籍</option></select><input id="url" placeholder="基础 URL，可留空"><input id="priority" type="number" value="200" placeholder="优先级"><button onclick="add()">添加</button></div><p id="msg" class="muted"></p></div><div id="list"></div><p><a href="/" style="color:#bfdbfe">← 返回首页</a></p></main><script>const $=x=>document.getElementById(x);async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}async function load(){try{const d=await api('/api/sources');$('list').innerHTML=(d.sources||[]).map(s=>`<div class="card source"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.type)} · ${esc(s.base_url||'未设置')}</div></div><div>优先级 ${s.priority}</div><div class="${s.enabled?'ok':'off'}">${s.enabled?'● 启用':'○ 停用'}</div><button onclick="toggle(${s.id},${!s.enabled})">${s.enabled?'停用':'启用'}</button></div>`).join('')||'<div class="card muted">暂无来源</div>'}catch(e){$('list').innerHTML='<div class="card off">'+esc(e.message)+'</div>'}}async function add(){try{await api('/api/sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,type:$('type').value,base_url:$('url').value,priority:Number($('priority').value)})});$('msg').textContent='添加成功';$('name').value='';$('url').value='';load()}catch(e){$('msg').textContent=e.message}}async function toggle(id,enabled){try{await api('/api/sources?id='+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});load()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load()</script></body></html>
